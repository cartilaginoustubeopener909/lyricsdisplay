name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-22.04, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'LyricsDisplay ${{ github.ref_name }}'
          releaseBody: 'Release ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

  build-mobile:
    name: Build mobile
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_LYRICSDISPLAY_UPLOAD_KEY_ALIAS: lyricsdisplay-android
      ORG_GRADLE_PROJECT_LYRICSDISPLAY_UPLOAD_KEYSTORE_PATH: lyricsdisplay-android.jks
      ORG_GRADLE_PROJECT_LYRICSDISPLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.LYRICSDISPLAY_UPLOAD_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_LYRICSDISPLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.LYRICSDISPLAY_UPLOAD_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_LYRICSDISPLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LYRICSDISPLAY_UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew decodeKeystore assembleRelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricsdisplay-android
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

      - name: Upload Android artifact to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
